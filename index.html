<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Binance RSI Scanner</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: #fff;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    h1 {
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 20px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 20px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 15px;
      cursor: pointer;
    }

    #startBtn {
      background: #16a34a;
      color: white;
    }

    #notifyBtn {
      background: #2563eb;
      color: white;
    }

    #stopBtn {
      background: #dc2626;
      color: white;
    }

    .status {
      background: #1f2937;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      line-height: 1.8;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }

    .coin {
      background: #1f2937;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }

    .symbol {
      font-weight: bold;
      font-size: 16px;
    }

    .rsi {
      font-size: 28px;
      margin-top: 8px;
    }

    .normal {
      color: white;
    }

    .high {
      color: #22c55e;
    }

    .low {
      color: #ef4444;
    }

    .alerts {
      margin-top: 20px;
      background: #1f2937;
      border-radius: 10px;
      padding: 15px;
    }

    .alert {
      padding: 10px;
      border-bottom: 1px solid #374151;
    }

    .log {
      margin-top: 20px;
      background: #0b1220;
      border-radius: 10px;
      padding: 15px;
      font-size: 13px;
      white-space: pre-wrap;
      max-height: 250px;
      overflow-y: auto;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📊 هشدار RSI برای Binance Futures</h1>

  <div class="subtitle">
    RSI 20 • تایم‌فریم 15 دقیقه • هشدار هنگام عبور از 70 یا 30 • بدون API Key
  </div>

  <div class="buttons">
    <button id="startBtn">▶ شروع اسکن</button>
    <button id="notifyBtn">🔔 فعال‌سازی اعلان</button>
    <button id="stopBtn">⛔ توقف</button>
  </div>

  <div class="status">
    <div>وضعیت: <span id="status">متوقف</span></div>
    <div>تعداد ارزها: 28</div>
    <div>تایم‌فریم: 15m</div>
    <div>RSI Length: 20</div>
    <div>هشدار بالا: RSI &gt; 70</div>
    <div>هشدار پایین: RSI &lt; 30</div>
  </div>

  <div id="coins" class="grid"></div>

  <div class="alerts">
    <h3>🚨 هشدارها</h3>
    <div id="alertsList">هنوز هشداری ثبت نشده.</div>
  </div>

  <div class="log" id="log"></div>

</div>

<script>

const SYMBOLS = [
  "COPPERUSDT",
  "CLUSDT",
  "XAUUSDT",
  "XAGUSDT",
  "BTCUSDT",
  "ETHUSDT",
  "FILUSDT",
  "SOLUSDT",
  "ICPUSDT",
  "XRPUSDT",
  "DOGEUSDT",
  "SHIBUSDT",
  "DYDXUSDT",
  "HBARUSDT",
  "NOTUSDT",
  "APTUSDT",
  "ENAUSDT",
  "AEROUSDT",
  "CHZUSDT",
  "GALAUSDT",
  "SNXUSDT",
  "TRXUSDT",
  "POPCATUSDT",
  "PEPEUSDT",
  "LINKUSDT",
  "UNIUSDT",
  "ADAUSDT",
  "AVAXUSDT"
];

const RSI_LENGTH = 20;
const UPPER = 70;
const LOWER = 30;

const REST_URL = "https://fapi.binance.com";
const WS_URL =
  "wss://fstream.binance.com/market/stream?streams=" +
  SYMBOLS.map(s => s.toLowerCase() + "@kline_15m").join("/");

let ws = null;
let running = false;

const previousRSI = {};
const rsiValues = {};
const lastAlert = {};

const coinsContainer = document.getElementById("coins");
const statusEl = document.getElementById("status");
const alertsList = document.getElementById("alertsList");
const logEl = document.getElementById("log");

function log(message) {
  const time = new Date().toLocaleTimeString("fa-IR");
  logEl.textContent =
    `[${time}] ${message}\n` + logEl.textContent;
}

function createCoins() {

  coinsContainer.innerHTML = "";

  SYMBOLS.forEach(symbol => {

    const div = document.createElement("div");

    div.className = "coin";
    div.id = "coin-" + symbol;

    div.innerHTML = `
      <div class="symbol">${symbol}</div>
      <div class="rsi normal" id="rsi-${symbol}">—</div>
    `;

    coinsContainer.appendChild(div);
  });
}

function calculateRSI(closes) {

  if (closes.length < RSI_LENGTH + 1) {
    return null;
  }

  let gain = 0;
  let loss = 0;

  for (let i = 1; i <= RSI_LENGTH; i++) {

    const change = closes[i] - closes[i - 1];

    if (change > 0) {
      gain += change;
    } else {
      loss -= change;
    }
  }

  gain /= RSI_LENGTH;
  loss /= RSI_LENGTH;

  for (let i = RSI_LENGTH + 1; i < closes.length; i++) {

    const change = closes[i] - closes[i - 1];

    const currentGain = change > 0 ? change : 0;
    const currentLoss = change < 0 ? -change : 0;

    gain =
      ((RSI_LENGTH - 1) * gain + currentGain) /
      RSI_LENGTH;

    loss =
      ((RSI_LENGTH - 1) * loss + currentLoss) /
      RSI_LENGTH;
  }

  if (loss === 0) {
    return 100;
  }

  const rs = gain / loss;

  return 100 - (100 / (1 + rs));
}

async function loadInitialData(symbol) {

  try {

    const response = await fetch(
      `${REST_URL}/fapi/v1/klines?symbol=${symbol}&interval=15m&limit=100`
    );

    const data = await response.json();

    if (!Array.isArray(data)) {
      log(`${symbol}: خطا در دریافت اطلاعات`);
      return;
    }

    const now = Date.now();

    const closed = data.filter(
      candle => Number(candle[6]) <= now
    );

    const closes = closed.map(
      candle => Number(candle[4])
    );

    if (closes.length < RSI_LENGTH + 2) {
      return;
    }

    const rsi = calculateRSI(closes);

    if (rsi !== null) {
      rsiValues[symbol] = rsi;
      updateRSI(symbol, rsi);
    }

  } catch (error) {

    log(`${symbol}: خطای اینترنت`);

  }
}

function updateRSI(symbol, value) {

  const element =
    document.getElementById("rsi-" + symbol);

  if (!element) return;

  element.textContent = value.toFixed(2);

  element.className = "rsi";

  if (value > UPPER) {
    element.classList.add("high");
  }
  else if (value < LOWER) {
    element.classList.add("low");
  }
  else {
    element.classList.add("normal");
  }
}

function sendAlert(symbol, direction, value) {

  const key =
    `${symbol}-${direction}-${Math.floor(Date.now() / 900000)}`;

  if (lastAlert[symbol] === key) {
    return;
  }

  lastAlert[symbol] = key;

  let text = "";

  if (direction === "UP") {

    text =
      `🚨 ${symbol}\nRSI 20 از 70 عبور کرد\nRSI: ${value.toFixed(2)}\nتایم‌فریم: 15m`;

  } else {

    text =
      `🚨 ${symbol}\nRSI 20 از 30 پایین‌تر رفت\nRSI: ${value.toFixed(2)}\nتایم‌فریم: 15m`;

  }

  const div = document.createElement("div");

  div.className = "alert";
  div.textContent =
    `${new Date().toLocaleTimeString("fa-IR")} — ${text}`;

  if (
    alertsList.textContent ===
    "هنوز هشداری ثبت نشده."
  ) {
    alertsList.innerHTML = "";
  }

  alertsList.prepend(div);

  log(text);

  if (
    "Notification" in window &&
    Notification.permission === "granted"
  ) {

    new Notification(
      "Binance RSI Alert",
      {
        body: text
      }
    );
  }
}

function handleClosedCandle(symbol, closes) {

  if (closes.length < RSI_LENGTH + 2) {
    return;
  }

  const previous =
    calculateRSI(closes.slice(0, -1));

  const current =
    calculateRSI(closes);

  if (
    previous === null ||
    current === null
  ) {
    return;
  }

  previousRSI[symbol] = previous;
  rsiValues[symbol] = current;

  updateRSI(symbol, current);

  if (
    previous <= UPPER &&
    current > UPPER
  ) {

    sendAlert(
      symbol,
      "UP",
      current
    );

  }

  if (
    previous >= LOWER &&
    current < LOWER
  ) {

    sendAlert(
      symbol,
      "DOWN",
      current
    );

  }
}

function connectWebSocket() {

  if (ws) {
    ws.close();
  }

  ws = new WebSocket(WS_URL);

  ws.onopen = () => {

    statusEl.textContent =
      "متصل به Binance";

    log("WebSocket متصل شد.");

  };

  ws.onclose = () => {

    statusEl.textContent =
      "اتصال قطع شد";

    log("WebSocket قطع شد.");

    if (running) {

      setTimeout(
        connectWebSocket,
        5000
      );

    }

  };

  ws.onerror = () => {

    log("خطا در WebSocket");

  };

  ws.onmessage = event => {

    try {

      const message =
        JSON.parse(event.data);

      const data =
        message.data;

      if (
        !data ||
        data.e !== "kline"
      ) {
        return;
      }

      const k =
        data.k;

      if (
        !k ||
        !k.x
      ) {
        return;
      }

      const symbol =
        k.s;

      loadInitialData(symbol);

    } catch (error) {

      log("خطا در پردازش WebSocket");

    }

  };
}

async function startScanner() {

  if (running) {
    return;
  }

  running = true;

  statusEl.textContent =
    "در حال دریافت اطلاعات...";

  log("شروع اسکن Binance Futures");

  for (const symbol of SYMBOLS) {

    await loadInitialData(symbol);

  }

  connectWebSocket();

}

function stopScanner() {

  running = false;

  if (ws) {
    ws.close();
    ws = null;
  }

  statusEl.textContent =
    "متوقف";

  log("اسکن متوقف شد.");

}

async function enableNotifications() {

  if (!("Notification" in window)) {

    alert(
      "مرورگر این دستگاه از Notification پشتیبانی نمی‌کند."
    );

    return;
  }

  const permission =
    await Notification.requestPermission();

  if (permission === "granted") {

    alert(
      "اعلان‌ها فعال شدند."
    );

    log(
      "Notification فعال شد."
    );

  } else {

    alert(
      "اجازه اعلان داده نشد."
    );

  }

}

document
  .getElementById("startBtn")
  .addEventListener(
    "click",
    startScanner
  );

document
  .getElementById("notifyBtn")
  .addEventListener(
    "click",
    enableNotifications
  );

document
  .getElementById("stopBtn")
  .addEventListener(
    "click",
    stopScanner
  );

createCoins();

</script>

</body>
</html>
