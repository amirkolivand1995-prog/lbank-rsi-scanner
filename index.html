<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1224">
<title>LBank RSI Alert</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1224;color:#eef3ff;font-family:Tahoma,Arial,sans-serif}
.wrap{max-width:760px;margin:auto;padding:12px}.card{background:#111b31;border:1px solid #263657;border-radius:20px;padding:16px;margin-bottom:14px}
h1{font-size:23px;margin:0 0 8px}.sub{color:#adbad3;line-height:1.9}.status{font-size:18px;font-weight:bold;margin:12px 0}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:#777;margin-left:7px}
button{border:0;border-radius:13px;padding:13px 17px;font-size:16px;font-weight:bold;margin:4px;cursor:pointer}
.start{background:#1769e8;color:#fff}.notify{background:#26385f;color:#fff}.stop{background:#5d2630;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.row{background:#0d1629;border-radius:11px;padding:10px;display:flex;justify-content:space-between}
.rsi{color:#b9c6df}.good{color:#36d98b}.bad{color:#ff6d7d}.log{background:#08101f;border-radius:12px;padding:10px;max-height:220px;overflow:auto;font-size:12px;line-height:1.9}
.alert{background:#1b2942;border-right:4px solid #3985ff;padding:9px;border-radius:9px;margin:6px 0}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>馃搳 賴卮丿丕乇 RSI 亘乇丕蹖 LBank Futures</h1>
<div class="sub">RSI 20 鈥� 鬲丕蹖賲鈥屬佖臂屬� 15 丿賯蹖賯賴 鈥� 賴卮丿丕乇 賴賳诏丕賲 毓亘賵乇 丕夭 70 蹖丕 30 鈥� 亘丿賵賳 API Key</div>
<div class="status"><span id="dot" class="dot"></span><span id="status">賲鬲賵賯賮 丕爻鬲</span></div>
<button class="start" id="start">鈻� 卮乇賵毓 丕爻讴賳</button>
<button class="notify" id="notify">馃敂 賮毓丕賱鈥屭┴必� 丕毓賱丕賳</button>
<button class="stop" id="stop">鈴� 鬲賵賯賮</button>
<div id="note" class="sub"></div>
</div>
<div class="card"><h2>賵囟毓蹖鬲 鄄鄹 賳賲丕丿</h2><div id="grid" class="grid"></div></div>
<div class="card"><h2>馃敂 賴卮丿丕乇賴丕</h2><div id="alerts">賴賳賵夭 賴卮丿丕乇蹖 孬亘鬲 賳卮丿賴.</div></div>
<div class="card"><h2>诏夭丕乇卮 丕鬲氐丕賱</h2><div id="log" class="log"></div></div>
</div>

<script>
const SYMBOLS=["XCUUSDT","XBRUSDT","GOLDUSDT","SILVERUSDT","BTCUSDT","ETHUSDT","FILUSDT","SOLUSDT","ICPUSDT","XRPUSDT","DOGEUSDT","SHIBUSDT","DYDXUSDT","HBARUSDT","NOTUSDT","APTUSDT","ENAUSDT","AEROUSDT","CHZUSDT","GALAUSDT","SNXUSDT","TRXUSDT","POPCATUSDT","PEPEUSDT","LINKUSDT","UNIUSDT","ADAUSDT","AVAXUSDT"];
const N=20,UP=70,DOWN=30,TF="15min",URL="wss://lbkperpws.lbank.com/ws";
const S={};let ws=null,running=false,timer=null;

for(const s of SYMBOLS){S[s]={bars:new Map(),current:null,last:null};let d=document.createElement("div");d.className="row";d.innerHTML='<b>'+s+'.P</b><span class="rsi" id="r-'+s+'">鈥�</span>';document.getElementById("grid").appendChild(d)}

function log(x){let d=document.createElement("div");d.textContent=new Date().toLocaleTimeString("fa-IR")+" 鈥� "+x;document.getElementById("log").prepend(d)}
function status(x,on){document.getElementById("status").textContent=x;document.getElementById("dot").style.background=on?"#19c56b":"#ff5d6c"}
function calc(a){if(a.length<N+1)return null;let g=0,l=0;for(let i=1;i<=N;i++){let d=a[i]-a[i-1];if(d>=0)g+=d;else l-=d}g/=N;l/=N;for(let i=N+1;i<a.length;i++){let d=a[i]-a[i-1],gg=d>0?d:0,ll=d<0?-d:0;g=((N-1)*g+gg)/N;l=((N-1)*l+ll)/N}return l===0?100:100-100/(1+g/l)}
function time(t){if(typeof t==="number")return t<1e12?t*1000:t;let n=Number(t);if(Number.isFinite(n))return n<1e12?n*1000:n;return Date.parse(t)}
function bar(x){if(!x||typeof x!=="object")return null;let k=x.kbar||x;let t=time(k.t??k.time??k.timestamp),c=Number(k.c??k.close);return Number.isFinite(t)&&Number.isFinite(c)?{t,c}:null}

function findBars(x,out=[]){
 if(!x)return out;
 if(Array.isArray(x)){if(x.length>=5){let t=time(x[0]),c=Number(x[4]);if(Number.isFinite(t)&&Number.isFinite(c))out.push({t,c})}else x.forEach(v=>findBars(v,out));return out}
 if(typeof x!=="object")return out;
 if(x.kbar){if(Array.isArray(x.kbar))x.kbar.forEach(v=>{let b=bar(v);if(b)out.push(b)});else{let b=bar(x.kbar);if(b)out.push(b)}}
 if(x.data){if(Array.isArray(x.data))x.data.forEach(v=>{let b=bar(v);if(b)out.push(b)});else{let b=bar(x.data);if(b)out.push(b)}}
 return out
}
function show(s,v){let e=document.getElementById("r-"+s);e.textContent=v==null?"鈥�":"RSI "+v.toFixed(2);e.className="rsi "+(v>70?"bad":v<30?"good":"")}

function alertRSI(s,up,v){
 let text=up?"馃毃 "+s+".P 鈥� RSI 20 亘丕賱丕蹖 70 乇賮鬲: "+v.toFixed(2):"馃毃 "+s+".P 鈥� RSI 20 夭蹖乇 30 乇賮鬲: "+v.toFixed(2);
 let a=document.getElementById("alerts");if(a.textContent.includes("賴賳賵夭"))a.innerHTML="";
 let d=document.createElement("div");d.className="alert";d.textContent=text;a.prepend(d);
 if("Notification"in window&&Notification.permission==="granted")try{new Notification("LBank RSI Alert",{body:text,tag:s+(up?"U":"D")})}catch(e){}
 try{navigator.vibrate&&navigator.vibrate([300,100,300])}catch(e){}
 log(text)
}

function addHistory(s,bs){
 let z=S[s];bs.sort((a,b)=>a.t-b.t).forEach(b=>z.bars.set(String(b.t),b.c));
 let a=[...z.bars].map(([t,c])=>({t:+t,c})).sort((a,b)=>a.t-b.t);while(a.length>160)z.bars.delete(String(a.shift().t));
 if(a.length){z.current=a[a.length-1].t;let v=calc(a.map(x=>x.c));if(v!=null){z.last=v;show(s,v)}}
}

function live(s,b){
 let z=S[s];
 if(z.current==null){z.current=b.t;z.bars.set(String(b.t),b.c);return}
 if(b.t===z.current){z.bars.set(String(b.t),b.c);return}
 z.bars.set(String(b.t),b.c);
 let a=[...z.bars].map(([t,c])=>({t:+t,c})).sort((a,b)=>a.t-b.t);
 let closed=a.filter(x=>x.t<=z.current),v=calc(closed.map(x=>x.c));
 if(v!=null&&z.last!=null){if(z.last<=UP&&v>UP)alertRSI(s,true,v);if(z.last>=DOWN&&v<DOWN)alertRSI(s,false,v);z.last=v;show(s,v)}
 z.current=b.t;while(a.length>160)z.bars.delete(String(a.shift().t))
}

function pairs(s){return [s,s.toLowerCase(),s.replace("USDT","_USDT").toLowerCase(),s.replace("USDT","_USDT")]}

function connect(){
 if(!running)return;try{ws&&ws.close()}catch(e){};status("丿乇 丨丕賱 丕鬲氐丕賱...",false);ws=new WebSocket(URL);
 ws.onopen=()=>{status("馃煝 賲鬲氐賱 鈥� 丿乇 丨丕賱 丿乇蹖丕賮鬲 郾鄣 丿賯蹖賯賴鈥屫й�",true);log("WebSocket 賲鬲氐賱 卮丿.");for(const s of SYMBOLS){for(const p of pairs(s)){ws.send(JSON.stringify({action:"request",request:"kbar",kbar:TF,pair:p,size:"120"}));ws.send(JSON.stringify({action:"subscribe",subscribe:"kbar",kbar:TF,pair:p}))}}log("丿乇禺賵丕爻鬲 Kline 亘乇丕蹖 鄄鄹 賳賲丕丿 丕乇爻丕賱 卮丿.")};
 ws.onmessage=e=>{if(typeof e.data!=="string")return;let m;try{m=JSON.parse(e.data)}catch(_){return}
  if(m.ping){try{ws.send(JSON.stringify({pong:m.ping}))}catch(_){}return}
  let p=String(m.pair||m.symbol||"").toUpperCase().replace(/_/g,"");let s=SYMBOLS.find(x=>p.includes(x));if(!s)return;
  let bs=findBars(m);if(!bs.length)return;bs.sort((a,b)=>a.t-b.t);bs.length>1?addHistory(s,bs):live(s,bs[0])
 };
 ws.onerror=()=>log("禺胤丕 丿乇 WebSocket.");
 ws.onclose=()=>{if(running){status("丕鬲氐丕賱 賯胤毓 卮丿 鈥� 鬲賱丕卮 賲噩丿丿...",false);log("丕鬲氐丕賱 賯胤毓 卮丿貨 鄣 孬丕賳蹖賴 丿蹖诏乇 鬲賱丕卮 賲蹖鈥屫促堌�.");timer=setTimeout(connect,5000)}}
}

document.getElementById("start").onclick=()=>{if(!running){running=true;document.getElementById("note").textContent="亘乇丕蹖 賴卮丿丕乇 賮賵乇蹖貙 氐賮丨賴 乇丕 亘丕夭 賳诏賴 丿丕乇蹖丿 賵 丕毓賱丕賳鈥屬囏� 乇丕 賮毓丕賱 讴賳蹖丿.";connect()}}
document.getElementById("stop").onclick=()=>{running=false;clearTimeout(timer);try{ws&&ws.close()}catch(e){};ws=null;status("賲鬲賵賯賮 丕爻鬲",false);log("丕爻讴賳 賲鬲賵賯賮 卮丿.")}
document.getElementById("notify").onclick=async()=>{if(!("Notification"in window)){alert("賲乇賵乇诏乇 丕蹖賳 诏賵卮蹖 丕夭 丕毓賱丕賳 賵亘 倬卮鬲蹖亘丕賳蹖 賳賲蹖鈥屭┵嗀�.");return}let p=await Notification.requestPermission();document.getElementById("note").textContent=p==="granted"?"鉁� 丕毓賱丕賳 诏賵卮蹖 賮毓丕賱 卮丿.":"鈿狅笍 丕噩丕夭賴 丕毓賱丕賳 丿丕丿賴 賳卮丿."}
status("賲鬲賵賯賮 丕爻鬲",false);log("氐賮丨賴 丌賲丕丿賴 丕爻鬲.");
</script>
</body>
</html>    <b>گزارش اتصال</b>

<script>
const SYMBOLS = [
"XCUUSDT","XBRUSDT","GOLDUSDT","SILVERUSDT","BTCUSDT","ETHUSDT","FILUSDT",
"SOLUSDT","ICPUSDT","XRPUSDT","DOGEUSDT","SHIBUSDT","DYDXUSDT","HBARUSDT",
"NOTUSDT","APTUSDT","ENAUSDT","AEROUSDT","CHZUSDT","GALAUSDT","SNXUSDT",
"TRXUSDT","POPCATUSDT","PEPEUSDT","LINKUSDT","UNIUSDT","ADAUSDT","AVAXUSDT"
];
const RSI_LEN=20, UP=70, DOWN=30, TF="15min";
const state=Object.fromEntries(SYMBOLS.map(s=>[s,{rsi:null,prev:null,lastBar:null,history:[]}]));
let ws=null, running=false, reconnectTimer=null;
const $=id=>document.getElementById(id);
function log(x){$("log").textContent=new Date().toLocaleTimeString()+"  "+x+"\n"+$("log").textContent.slice(0,5000)}
function setStatus(t,on=false){$("status").textContent=t;$("dot").classList.toggle("on",on)}
function render(){
  $("grid").innerHTML=SYMBOLS.map(s=>{
    const x=state[s], r=x.rsi;
    let cls="normal",txt=r==null?"—":r.toFixed(2);
    if(r!=null&&r>70) cls="hotup"; else if(r!=null&&r<30) cls="hotdn";
    return `<div class="row"><span class="sym">${s}.P</span><span class="rsi ${cls}">${txt}</span></div>`;
  }).join("");
}
function rsi(vals){
  if(vals.length<RSI_LEN+1) return null;
  let gains=0,losses=0;
  for(let i=1;i<=RSI_LEN;i++){const d=vals[i]-vals[i-1];if(d>=0)gains+=d;else losses-=d}
  let ag=gains/RSI_LEN, al=losses/RSI_LEN;
  for(let i=RSI_LEN+1;i<vals.length;i++){
    const d=vals[i]-vals[i-1],g=Math.max(d,0),l=Math.max(-d,0);
    ag=(ag*(RSI_LEN-1)+g)/RSI_LEN; al=(al*(RSI_LEN-1)+l)/RSI_LEN;
  }
  if(al===0) return 100;
  return 100-(100/(1+ag/al));
}
function notifyUser(msg){
  if("Notification" in window && Notification.permission==="granted") new Notification("LBank RSI Alert",{body:msg});
}
function processBar(symbol, bar, confirmed=true){
  const x=state[symbol], close=Number(bar.c);
  if(!Number.isFinite(close)) return;
  const t=String(bar.t);
  const oldBar=x.lastBar;
  if(oldBar===t){ x.history[x.history.length-1]=close; }
  else { x.lastBar=t; x.history.push(close); if(x.history.length>300)x.history.shift(); }
  const old=x.rsi; const now=rsi(x.history); x.prev=old; x.rsi=now;
  if(confirmed && old!=null && now!=null){
    if(old<=70 && now>70){const m=`🔴 ${symbol}.P | RSI 20 = ${now.toFixed(2)} > 70`; notifyUser(m); log(m)}
    if(old>=30 && now<30){const m=`🟢 ${symbol}.P | RSI 20 = ${now.toFixed(2)} < 30`; notifyUser(m); log(m)}
  }
  render();
}
function connect(){
  if(ws){try{ws.close()}catch(e){}}
  setStatus("در حال اتصال به LBank Futures...",false);
  ws=new WebSocket("wss://lbkperpws.lbank.com/ws");
  ws.onopen=()=>{
    setStatus("متصل — در حال دریافت ۱۵ دقیقه‌ای",true);log("WebSocket متصل شد.");
    // First request history so RSI 20 is available immediately.
    SYMBOLS.forEach(s=>{
      ws.send(JSON.stringify({action:"request",request:"kbar",kbar:"15min",pair:s,size:"100"}));
    });
    // Then subscribe to live 15m candles.
    SYMBOLS.forEach(s=>{
      ws.send(JSON.stringify({action:"subscribe",subscribe:"kbar",kbar:"15min",pair:s}));
    });
    log("تاریخچه ۱۵ دقیقه‌ای + اشتراک زنده برای ۲۸ نماد ارسال شد.");
  };
  ws.onmessage=e=>{
    let d; try{d=JSON.parse(e.data)}catch{return}
    if(d.action==="ping"){ws.send(JSON.stringify({action:"pong",pong:d.ping}));return}
    if(d.type==="kbar" && d.pair && d.kbar){
      const s=d.pair.toUpperCase(); if(state[s]) processBar(s,d.kbar,true);
    }
    // Historical request responses can vary by LBank gateway version.
    if((d.type==="kbar" || d.type==="kbars" || d.request==="kbar") && d.pair){
      const s=d.pair.toUpperCase();
      const arr = Array.isArray(d.data) ? d.data : (Array.isArray(d.kbars) ? d.kbars : null);
      if(state[s] && arr && arr.length){
        state[s].history=[];
        state[s].lastBar=null;
        for(const b of arr){
          const bar = Array.isArray(b) ? {t:b[0],o:b[1],h:b[2],l:b[3],c:b[4],v:b[5]} : b;
          processBar(s,bar,false);
        }
      }
    }
  };
  ws.onerror=()=>{setStatus("خطا در اتصال",false);log("خطای WebSocket")}
  ws.onclose=()=>{if(running){setStatus("اتصال قطع شد؛ تلاش مجدد...",false);clearTimeout(reconnectTimer);reconnectTimer=setTimeout(connect,4000)}}
}
$("start").onclick=()=>{
  running=!running;
  if(running){$("start").textContent="⏸ توقف اسکن";connect()}else{if(ws)ws.close();setStatus("متوقف",false);$("start").textContent="▶ شروع اسکن"}
};
$("notify").onclick=async()=>{
  if(!("Notification" in window)){alert("این مرورگر اعلان را پشتیبانی نمی‌کند.");return}
  const p=await Notification.requestPermission();
  if(p==="granted"){log("اعلان‌های گوشی فعال شد.");$("notify").textContent="🔔 اعلان فعال است"}else log("اجازه اعلان داده نشد.");
};
render();
</script>
