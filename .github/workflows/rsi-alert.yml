name: Binance RSI Telegram Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: binance-rsi-scanner
  cancel-in-progress: false

jobs:

  scan:

    runs-on: ubuntu-latest

    timeout-minutes: 4

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: |
          python -m pip install --disable-pip-version-check requests

      - name: Test Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["TELEGRAM_BOT_TOKEN"]

          url = f"https://api.telegram.org/bot{token}/getMe"

          response = requests.get(
              url,
              timeout=20
          )

          print("Telegram HTTP STATUS:", response.status_code)

          response.raise_for_status()

          data = response.json()

          if not data.get("ok"):
              raise RuntimeError("Telegram bot test failed.")

          print("Telegram connection: OK")
          PY

      - name: Test Binance Futures
        run: |
          python - <<'PY'
          import requests

          url = "https://fapi.binance.com/fapi/v1/exchangeInfo"

          response = requests.get(
              url,
              timeout=20
          )

          print("Binance HTTP STATUS:", response.status_code)
          print("Binance RESPONSE:")
          print(response.text[:2000])
          PY

      - name: Run RSI scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          python scanner.py

      - name: Save scanner state
        run: |

          if git diff --quiet -- rsi-state.json; then
            echo "No state change."
            exit 0
          fi

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add rsi-state.json

          git commit -m "Update RSI scanner state"

          git push
